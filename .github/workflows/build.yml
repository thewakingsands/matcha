name: Build

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Thirdparty_ACT: https://github.com/EQAditu/AdvancedCombatTracker/releases/download/3.8.5.288/ACTv3.zip
      # Keep the unsigned SDK for compatibility with the customized CN host.
      Thirdparty_FFXIV_ACT_Plugin: https://github.com/TundraWork/FFXIV_ACT_Plugin_CN/raw/refs/heads/master/FFXIV_ACT_Plugin_SDK_3.0.2.7.zip
      Solution_Name: Cafe.Matcha.sln
      Secret_Path: Cafe.Matcha\Constant\Secret.Local.cs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game data generation
        run: node --test utils/update-data.test.mjs
      - name: Test fishing service with artificial data
        run: dotnet run --project tests/FishingService
      - name: Test initial data export
        run: dotnet run --project tests/InitialData

      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Setup thirdparty dependencies
        run: |
          nuget restore ${{ env.Solution_Name }}

          New-Item -Name "thirdparty" -ItemType "directory" -Force

          Invoke-WebRequest -Uri ${{ env.Thirdparty_ACT }} -OutFile thirdparty\ACT.zip
          Expand-Archive thirdparty\ACT.zip -DestinationPath thirdparty\ACT -Force

          Invoke-WebRequest -Uri ${{ env.Thirdparty_FFXIV_ACT_Plugin }} -OutFile thirdparty\FFXIV_ACT_Plugin.zip
          Expand-Archive thirdparty\FFXIV_ACT_Plugin.zip -DestinationPath thirdparty\FFXIV_ACT_Plugin -Force

          $sdkReferences = @('FFXIV_ACT_Plugin.dll', 'SDK\FFXIV_ACT_Plugin.Common.dll', 'SDK\FFXIV_ACT_Plugin.Memory.dll', 'SDK\FFXIV_ACT_Plugin.Network.dll')
          foreach ($reference in $sdkReferences) {
            $assemblyPath = (Resolve-Path (Join-Path 'thirdparty\FFXIV_ACT_Plugin' $reference)).Path
            $identity = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath)
            if ($identity.GetPublicKeyToken().Length -ne 0) {
              throw "Signed SDK reference is incompatible with the customized CN host: $reference"
            }
          }

          Get-ChildItem .\thirdparty
          Get-ChildItem .\thirdparty\ACT
          Get-ChildItem .\thirdparty\FFXIV_ACT_Plugin

      - name: Write Secrets
        run: |
          $secret_content = [System.Convert]::FromBase64String("${{ secrets.CONSTANT_SECRET_LOCAL }}")
          [IO.File]::WriteAllBytes("${{ env.Secret_Path }}", $secret_content)

      - name: Build
        run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Remove Secrets
        run: Remove-Item -path ${{ env.Secret_Path }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bundle
          path: bin\*.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bin\*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Telegram Notify
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          export FILENAME=`cd bin && ls *.zip`
          curl -X POST -F chat_id=${{ secrets.TELEGRAM_CHAT }} -F "document=@\"bin/${FILENAME}\"" https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument
